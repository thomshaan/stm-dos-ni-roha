function Aktivitas() {
  const S = window.STM;
  const [filter, setFilter] = React.useState("Semua");
  const iconMap = { payment:"money", create:"plus", update:"edit", auth:"user", export:"download", warn:"alert" };
  const colorMap = { payment:"var(--success)", create:"var(--accent)", update:"var(--info)", auth:"var(--muted)", export:"var(--accent-2)", warn:"var(--danger)" };
  const list = filter === "Semua" ? S.AKTIVITAS : S.AKTIVITAS.filter(a => a.tipe === filter);
  const grouped = {};
  for (const a of list) { const d = a.waktu.slice(0,10); (grouped[d] = grouped[d] || []).push(a); }
  const days = Object.keys(grouped).sort().reverse();

  return (
    <div className="card">
      <div className="card-hd">
        <div><h3>Riwayat Aktivitas Admin</h3><div className="muted" style={{fontSize:12}}>Log aksi pengurus pada sistem · {S.AKTIVITAS.length} entri</div></div>
        <div className="card-hd-actions">
          <div className="seg">
            {["Semua","payment","create","update","export","warn","auth"].map(t => (
              <button key={t} data-active={filter===t?"1":"0"} onClick={() => setFilter(t)}>
                {t==="Semua"?"Semua":t}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="card-pad">
        {days.map(d => (
          <div key={d} style={{marginBottom:24}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10,paddingLeft:42}}>{d}</div>
            <div style={{position:"relative",paddingLeft:14}}>
              <div style={{position:"absolute",left:28,top:0,bottom:0,width:2,background:"var(--line)"}}/>
              {grouped[d].map(a => (
                <div key={a.id} style={{display:"flex",alignItems:"flex-start",gap:14,padding:"8px 0",position:"relative"}}>
                  <div style={{width:30,height:30,borderRadius:8,background:"var(--surface-2)",color:colorMap[a.tipe],display:"grid",placeItems:"center",border:"2px solid var(--surface)",zIndex:1,boxShadow:"0 0 0 1px var(--line)",flexShrink:0}}>
                    <Icon name={iconMap[a.tipe]||"history"} size={14}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,color:"var(--ink-2)"}}><b style={{color:"var(--ink)"}}>{a.user}</b> {a.aksi.toLowerCase()}</div>
                    <div style={{fontSize:12,color:"var(--muted)",marginTop:1}}>{a.detail}</div>
                  </div>
                  <div className="tab-num" style={{fontSize:11.5,color:"var(--muted)",whiteSpace:"nowrap"}}>{a.waktu.slice(11)}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PrintPreview({ currency }) {
  const S = window.STM;
  const [bulan, setBulan] = React.useState(4);
  const [tahun, setTahun] = React.useState(2026);
  const fmt = (v) => S.formatCurrency(v, currency);
  const toast = useToast();

  const pays = S.pembayaranBulan(bulan, tahun);
  const total = pays.reduce((s,p) => s + p.nominal, 0);
  const map = new Map();
  for (const p of pays) {
    if (!map.has(p.id_keluarga)) map.set(p.id_keluarga, {perJenis:{},total:0});
    const row = map.get(p.id_keluarga);
    row.perJenis[p.id_jenis] = (row.perJenis[p.id_jenis]||0) + p.nominal;
    row.total += p.nominal;
  }
  const rows = Array.from(map.entries()).map(([idK,r]) => ({ keluarga: S.KELUARGA.find(k=>k.id_keluarga===idK), ...r })).sort((a,b)=>b.total-a.total);

  return (
    <div>
      <div className="card mb-16">
        <div className="card-hd">
          <div><h3>Cetak & Export</h3><div className="muted" style={{fontSize:12}}>Pratinjau laporan A4 sebelum dicetak atau di-export</div></div>
          <div className="card-hd-actions">
            <select className="select" style={{width:140}} value={bulan} onChange={e => setBulan(Number(e.target.value))}>
              {S.BULAN_ID_FULL.map((b,i) => <option key={i} value={i+1}>{b}</option>)}
            </select>
            <select className="select" style={{width:100}} value={tahun} onChange={e => setTahun(Number(e.target.value))}>
              {[2024,2025,2026].map(y => <option key={y}>{y}</option>)}
            </select>
            <button className="btn btn-sec btn-sm" onClick={() => toast({kind:"success",title:"Excel siap diunduh",body:`Rekap-${S.BULAN_ID[bulan-1]}-${tahun}.xlsx`})}>
              <Icon name="file_excel" size={14}/> Excel
            </button>
            <button className="btn btn-sec btn-sm" onClick={() => toast({kind:"success",title:"PDF siap diunduh",body:`Rekap-${S.BULAN_ID[bulan-1]}-${tahun}.pdf`})}>
              <Icon name="file_pdf" size={14}/> PDF
            </button>
            <button className="btn btn-dark btn-sm" onClick={() => window.print()}>
              <Icon name="print" size={14}/> Print
            </button>
          </div>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"center",padding:"20px 0"}}>
        <div className="print-page">
          <div className="print-hd">
            <div><h1>LAPORAN REKAP TABUNGAN</h1><h2>STM Dos Ni Roha · {S.BULAN_ID_FULL[bulan-1]} {tahun}</h2></div>
            <div className="print-meta">
              <div>Dicetak: 18 Mei 2026</div>
              <div>Oleh: Robert Marpaung</div>
              <div>Periode: {S.BULAN_ID_FULL[bulan-1]} {tahun}</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginTop:20,fontSize:11}}>
            {[["Total Setor",fmt(total)],["Transaksi",pays.length],["Anggota Setor",rows.length],["Rata-rata",fmt(rows.length?total/rows.length:0)]].map(([l,v])=>(
              <div key={l} style={{padding:"10px 12px",background:"#f6efe1",borderRadius:6}}>
                <div style={{color:"#777",textTransform:"uppercase",letterSpacing:".05em",fontWeight:600,fontSize:10}}>{l}</div>
                <div style={{fontSize:15,fontWeight:700,marginTop:2}} className="tab-num">{v}</div>
              </div>
            ))}
          </div>
          <table className="print-tbl">
            <thead>
              <tr>
                <th style={{width:28}}>#</th>
                <th>Anggota</th>
                {S.JENIS_IURAN.map(j => <th key={j.id_jenis} className="num">{j.nama_jenis}</th>)}
                <th className="num">Total</th>
              </tr>
            </thead>
            <tbody>
              {rows.slice(0, 20).map((r,i) => (
                <tr key={r.keluarga?.id_keluarga}>
                  <td className="num">{i+1}</td>
                  <td>
                    <div style={{fontWeight:600}}>{r.keluarga?.kepala_keluarga}</div>
                    <div style={{fontSize:10,color:"#777"}} className="tab-num">{r.keluarga?.no_anggota}</div>
                  </td>
                  {S.JENIS_IURAN.map(j => <td key={j.id_jenis} className="num">{r.perJenis[j.id_jenis]?fmt(r.perJenis[j.id_jenis]):"—"}</td>)}
                  <td className="num"><b>{fmt(r.total)}</b></td>
                </tr>
              ))}
              {rows.length > 20 && (
                <tr><td colSpan={3+S.JENIS_IURAN.length} style={{textAlign:"center",fontStyle:"italic",color:"#777"}}>
                  … {rows.length-20} baris lainnya (halaman berikutnya)
                </td></tr>
              )}
            </tbody>
            <tfoot>
              <tr>
                <td colSpan={2}>TOTAL</td>
                {S.JENIS_IURAN.map(j => { const t=pays.filter(p=>p.id_jenis===j.id_jenis).reduce((s,p)=>s+p.nominal,0); return <td key={j.id_jenis} className="num">{fmt(t)}</td>; })}
                <td className="num">{fmt(total)}</td>
              </tr>
            </tfoot>
          </table>
          <div className="print-ft">
            <div>
              <div>Catatan:</div>
              <div style={{marginTop:4,maxWidth:280,color:"#888"}}>Laporan ini dihasilkan otomatis oleh sistem tabungan STM Dos Ni Roha. Mohon konfirmasi nominal sebelum disahkan dalam rapat pengurus.</div>
            </div>
            <div className="print-sign"><div>Mengetahui,</div><div className="line">Bendahara STM</div></div>
            <div className="print-sign"><div>Disusun oleh,</div><div className="line">Admin Sistem</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}
Object.assign(window, { JenisIuran, UsersAdmin, Aktivitas, PrintPreview });
  </script>

  <!-- app -->
  <script type="text/babel">
const TWEAK_DEFAULTS = {
  "palette": ["#b8694a", "#7a8c4d", "#4a6f8a"],
  "density": "cozy",
  "sidebar": "expanded",
  "currency": "rp",
  "font": "Plus Jakarta Sans"
};

const PALETTES = {
  "Terracotta · Olive · Indigo": { value:["#b8694a","#7a8c4d","#4a6f8a"], accent:"#b8694a",accent2:"#9a5638",accentSoft:"#f2d9c8",success:"#6f8a3f",sidebar:"#2a1d12",sidebar2:"#3a281a",bg:"#f6efe1",bg2:"#faf5e9",ink:"#2a1d12",line:"#e6d9bd",line2:"#efe4ca" },
  "Burgundy · Sage · Cream":     { value:["#9a3b3b","#7a8c4d","#e8dbc1"], accent:"#9a3b3b",accent2:"#7c2e2e",accentSoft:"#f0d4d4",success:"#6f8a3f",sidebar:"#2a1818",sidebar2:"#3c2424",bg:"#f5ece0",bg2:"#faf3e8",ink:"#2a1818",line:"#e6d6c0",line2:"#efe2cc" },
  "Coffee · Caramel · Mocha":    { value:["#8b5a2b","#c8893a","#3a2818"], accent:"#8b5a2b",accent2:"#6e4220",accentSoft:"#ecd6b8",success:"#6f8a3f",sidebar:"#241712",sidebar2:"#34241c",bg:"#f5ebd9",bg2:"#fbf2e3",ink:"#241712",line:"#e4d4b4",line2:"#ede0c4" },
  "Forest · Moss · Stone":       { value:["#4d6b3a","#7a8c4d","#3a3528"], accent:"#4d6b3a",accent2:"#3a5429",accentSoft:"#d5e0c2",success:"#6f8a3f",sidebar:"#1f2418",sidebar2:"#2c3422",bg:"#f1eee0",bg2:"#f7f4e8",ink:"#22281b",line:"#dcd8c3",line2:"#e5e2d0" },
};
const PALETTE_NAMES = Object.keys(PALETTES);

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState("dashboard");
  const [search, setSearch] = React.useState("");
  const [presetKeluarga, setPresetKeluarga] = React.useState(null);

  React.useEffect(() => {
    const match = Object.entries(PALETTES).find(([_, p]) => JSON.stringify(p.value) === JSON.stringify(t.palette));
    const p = match ? match[1] : PALETTES[PALETTE_NAMES[0]];
    const r = document.documentElement.style;
    r.setProperty("--accent", p.accent); r.setProperty("--accent-2", p.accent2); r.setProperty("--accent-soft", p.accentSoft);
    r.setProperty("--success", p.success); r.setProperty("--sidebar", p.sidebar); r.setProperty("--sidebar-2", p.sidebar2);
    r.setProperty("--bg", p.bg); r.setProperty("--bg-2", p.bg2); r.setProperty("--ink", p.ink);
    r.setProperty("--line", p.line); r.setProperty("--line-2", p.line2);
  }, [t.palette]);

  React.useEffect(() => {
    document.documentElement.style.setProperty("--font", `'${t.font}', ui-sans-serif, system-ui, sans-serif`);
  }, [t.font]);

  const goAddPayment = (kel) => { setPresetKeluarga(kel); setRoute("input"); };

  const titles = {
    dashboard:    ["Dashboard",          "Ringkasan saldo tabungan & tren setoran"],
    keluarga:     ["Daftar Keluarga",    "Anggota terdaftar pada STM Dos Ni Roha"],
    input:        ["Input Setoran",      "Catat setoran tabungan anggota"],
    "rekap-bulan":["Rekap Bulanan",      "Setoran agregat per bulan"],
    "rekap-tahun":["Rekap Tahunan",      "Perbandingan tahunan & multi-tahun"],
    print:        ["Cetak / Export",     "Pratinjau laporan A4 & ekspor file"],
    jenis:        ["Jenis Tabungan",     "Konfigurasi kategori setoran"],
    users:        ["User & Pengurus",    "Akses sistem admin & bendahara"],
    aktivitas:    ["Riwayat Aktivitas",  "Audit log aksi pengurus"],
  };
  const [title, crumb] = titles[route] || titles.dashboard;

  const renderScreen = () => {
    switch (route) {
      case "dashboard":    return <Dashboard setRoute={setRoute} currency={t.currency}/>;
      case "keluarga":     return <Keluarga search={search} setSearch={setSearch} currency={t.currency} onAddPayment={goAddPayment}/>;
      case "input":        return <InputPembayaran presetKeluarga={presetKeluarga} currency={t.currency}/>;
      case "rekap-bulan":  return <RekapBulanan currency={t.currency}/>;
      case "rekap-tahun":  return <RekapTahunan currency={t.currency}/>;
      case "print":        return <PrintPreview currency={t.currency}/>;
      case "jenis":        return <JenisIuran currency={t.currency}/>;
      case "users":        return <UsersAdmin/>;
      case "aktivitas":    return <Aktivitas/>;
      default:             return <Dashboard setRoute={setRoute} currency={t.currency}/>;
    }
  };

  const sidebarShowSearch = route === "keluarga";
  const cyclePalette = () => {
    const i = PALETTE_NAMES.findIndex(n => JSON.stringify(PALETTES[n].value) === JSON.stringify(t.palette));
    const next = PALETTES[PALETTE_NAMES[(i + 1) % PALETTE_NAMES.length]].value;
    setTweak("palette", next);
  };

  return (
    <ToastHost>
      <div className="app" data-sidebar={t.sidebar} data-density={t.density}>
        <Sidebar route={route} setRoute={(r) => { setRoute(r); if (r !== "input") setPresetKeluarga(null); }}/>
        <div className="main">
          <Topbar
            title={title} crumb={crumb}
            onToggleSidebar={() => setTweak("sidebar", t.sidebar === "expanded" ? "collapsed" : "expanded")}
            search={sidebarShowSearch ? search : null}
            onSearch={sidebarShowSearch ? setSearch : null}
            rightSlot={
              <>
                <button className="tb-icon-btn" onClick={cyclePalette} aria-label="Ganti tema" title="Ganti tema warna">
                  <span style={{display:"inline-flex",gap:2}}>
                    {t.palette.slice(0,3).map((c,i) => <span key={i} style={{width:8,height:14,borderRadius:2,background:c}}/>)}
                  </span>
                </button>
                <button className="btn btn-primary btn-sm" onClick={() => { setPresetKeluarga(null); setRoute("input"); }}>
                  <Icon name="plus" size={14}/> Catat Setoran
                </button>
              </>
            }
          />
          <main className="content">{renderScreen()}</main>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Tema">
          <TweakColor label="Palette" value={t.palette}
                      options={PALETTE_NAMES.map(n => PALETTES[n].value)}
                      onChange={(v) => setTweak("palette", v)}/>
        </TweakSection>
        <TweakSection label="Tata Letak">
          <TweakRadio label="Sidebar" value={t.sidebar}
                      options={[{value:"expanded",label:"Full"},{value:"iconOnly",label:"Ikon"}]}
                      onChange={(v) => setTweak("sidebar", v)}/>
          <TweakRadio label="Density Tabel" value={t.density}
                      options={[{value:"cozy",label:"Cozy"},{value:"compact",label:"Compact"}]}
                      onChange={(v) => setTweak("density", v)}/>
        </TweakSection>
        <TweakSection label="Format & Tipografi">
          <TweakRadio label="Mata Uang" value={t.currency}
                      options={[{value:"rp",label:"Rp"},{value:"idr",label:"IDR"}]}
                      onChange={(v) => setTweak("currency", v)}/>
          <TweakSelect label="Font" value={t.font}
                       options={["Plus Jakarta Sans","Inter","Manrope"]}
                       onChange={(v) => setTweak("font", v)}/>
        </TweakSection>
      </TweaksPanel>
    </ToastHost>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
