<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>STM Dos Ni Roha — Sistem Tabungan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
/* STM Dos Ni Roha — warm community admin */
:root{
  --bg: #f6efe1;
  --bg-2: #faf5e9;
  --surface: #ffffff;
  --surface-2: #fbf6ea;
  --sidebar: #2a1d12;
  --sidebar-2: #3a281a;
  --sidebar-fg: #f0e3c6;
  --sidebar-muted: #b09c79;
  --ink: #2a1d12;
  --ink-2: #4a3a28;
  --muted: #8a7659;
  --line: #e6d9bd;
  --line-2: #efe4ca;
  --accent: #b8694a;
  --accent-2: #9a5638;
  --accent-soft: #f2d9c8;
  --success: #6f8a3f;
  --success-soft: #e3ead0;
  --warning: #c8893a;
  --warning-soft: #f5e3c1;
  --danger: #a64b3a;
  --danger-soft: #f3d4c8;
  --info: #4a6f8a;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(74,58,40,.06), 0 1px 1px rgba(74,58,40,.04);
  --shadow: 0 1px 2px rgba(74,58,40,.06), 0 6px 24px -8px rgba(74,58,40,.16);
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --row-py: 14px;
  --row-px: 16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit}

/* ───────── Shell ───────── */
.app{display:grid;grid-template-columns:var(--sidebar-w,248px) 1fr;min-height:100vh;transition:grid-template-columns .25s cubic-bezier(.3,.7,.4,1)}
.app[data-sidebar="collapsed"]{--sidebar-w:72px}
.app[data-sidebar="iconOnly"]{--sidebar-w:72px}

.sidebar{background:var(--sidebar);color:var(--sidebar-fg);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:10px}
.sb-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#d88a6c);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sb-name{font-weight:700;font-size:13.5px;letter-spacing:.01em;white-space:nowrap}
.sb-sub{font-size:11px;color:var(--sidebar-muted);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.sb-section{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sidebar-muted);padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--sidebar-fg);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .12s, color .12s;position:relative}
.sb-item:hover{background:rgba(255,255,255,.05)}
.sb-item[data-active="1"]{background:rgba(184,105,74,.18);color:#ffd9c6}
.sb-item[data-active="1"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.sb-ico{width:18px;height:18px;flex-shrink:0;opacity:.85}
.sb-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.sb-badge{background:rgba(255,255,255,.1);color:var(--sidebar-fg);font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:600;font-variant-numeric:tabular-nums}
.sb-badge.warn{background:var(--danger);color:#fff}

.sb-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.07);padding-top:12px;display:flex;align-items:center;gap:10px;padding-left:8px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:#7a4f37;display:grid;place-items:center;color:#f5ebd9;font-weight:600;font-size:12.5px;flex-shrink:0}
.sb-user-name{font-size:12.5px;font-weight:600;color:var(--sidebar-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:10.5px;color:var(--sidebar-muted);white-space:nowrap}

.app[data-sidebar="collapsed"] .sb-label,
.app[data-sidebar="collapsed"] .sb-name,
.app[data-sidebar="collapsed"] .sb-sub,
.app[data-sidebar="collapsed"] .sb-section,
.app[data-sidebar="collapsed"] .sb-badge,
.app[data-sidebar="collapsed"] .sb-user-name,
.app[data-sidebar="collapsed"] .sb-user-role,
.app[data-sidebar="iconOnly"] .sb-label,
.app[data-sidebar="iconOnly"] .sb-name,
.app[data-sidebar="iconOnly"] .sb-sub,
.app[data-sidebar="iconOnly"] .sb-section,
.app[data-sidebar="iconOnly"] .sb-badge,
.app[data-sidebar="iconOnly"] .sb-user-name,
.app[data-sidebar="iconOnly"] .sb-user-role{display:none}
.app[data-sidebar="collapsed"] .sb-item,
.app[data-sidebar="iconOnly"] .sb-item{justify-content:center;padding:10px}
.app[data-sidebar="collapsed"] .sb-brand,
.app[data-sidebar="iconOnly"] .sb-brand{justify-content:center;padding:6px 0 14px}
.app[data-sidebar="collapsed"] .sb-foot,
.app[data-sidebar="iconOnly"] .sb-foot{padding-left:0;justify-content:center}

/* ───────── Main ───────── */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--bg);position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line)}
.tb-title{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.tb-crumb{color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.tb-spacer{flex:1}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:280px;color:var(--muted)}
.tb-search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:13px;color:var(--ink);width:100%}
.tb-search input::placeholder{color:var(--muted)}
.tb-icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative}
.tb-icon-btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.tb-icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}

.content{padding:24px 28px 60px;min-height:calc(100vh - 64px)}

/* ───────── Cards & layout ───────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-hd h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.card-hd .muted{color:var(--muted);font-size:12.5px}
.card-hd-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.row{display:flex;align-items:center;gap:12px}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}

/* ───────── Stat cards ───────── */
.stat{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.stat-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)}
.stat-ico.green{background:var(--success-soft);color:var(--success)}
.stat-ico.warn{background:var(--warning-soft);color:var(--warning)}
.stat-ico.red{background:var(--danger-soft);color:var(--danger)}
.stat-val{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.stat-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat-trend{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-trend.up{background:var(--success-soft);color:var(--success)}
.stat-trend.down{background:var(--danger-soft);color:var(--danger)}

/* ───────── Buttons ───────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit;line-height:1;white-space:nowrap;transition:transform .06s, background .12s, border-color .12s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn-sec{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn-sec:hover{background:var(--surface-2)}
.btn-dark{background:var(--sidebar);color:#fff;border-color:var(--sidebar)}
.btn-dark:hover{background:var(--sidebar-2)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center}

/* ───────── Tables ───────── */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:12px var(--row-px);background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th[data-sortable]{cursor:pointer}
.tbl th[data-sortable]:hover{color:var(--ink-2)}
.tbl th .sort-ico{display:inline-block;margin-left:4px;opacity:.5}
.tbl th[data-sort] .sort-ico{opacity:1;color:var(--accent)}
.tbl td{padding:var(--row-py) var(--row-px);border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--ink-2)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl-num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl-noborder tbody tr:last-child td{border-bottom:0}
.app[data-density="compact"] .tbl{font-size:12.5px}
.app[data-density="compact"]{--row-py:9px;--row-px:12px}
.app[data-density="compact"] .tbl th{padding:9px 12px}

.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px;flex-shrink:0;letter-spacing:.02em}
.avatar.sm{width:26px;height:26px;font-size:11px}

/* ───────── Badges ───────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.01em;line-height:1.3;white-space:nowrap}
.badge-green{background:var(--success-soft);color:var(--success)}
.badge-red{background:var(--danger-soft);color:var(--danger)}
.badge-warn{background:var(--warning-soft);color:var(--warning)}
.badge-neutral{background:#ebe1c8;color:var(--ink-2)}
.badge-accent{background:var(--accent-soft);color:var(--accent-2)}
.badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ───────── Charts ───────── */
.chart-wrap{padding:16px 20px 18px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-axis{font-size:10.5px;fill:var(--muted);font-family:var(--font);font-variant-numeric:tabular-nums}
.chart-grid{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 4}
.chart-bar{fill:var(--accent);transition:fill .15s}
.chart-bar:hover{fill:var(--accent-2)}
.chart-bar-soft{fill:var(--accent-soft)}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#chartAreaFill)}
.chart-dot{fill:#fff;stroke:var(--accent);stroke-width:2}
.donut-track{fill:none;stroke:var(--line-2);stroke-width:18}
.tooltip{position:absolute;background:var(--sidebar);color:#fff;font-size:11.5px;padding:6px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;font-weight:500;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tooltip b{font-weight:700}

/* ───────── Pagination ───────── */
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.pager-pages{display:flex;gap:4px}
.pager-pages button{min-width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500}
.pager-pages button:hover{background:var(--surface-2);border-color:var(--line-2)}
.pager-pages button[data-active="1"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager-pages button:disabled{opacity:.4;cursor:not-allowed}

/* ───────── Forms ───────── */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--muted)}
.input,.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;transition:border-color .12s, box-shadow .12s;width:100%}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.select{padding-right:32px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238a7659' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
.input[data-prefix]{padding-left:38px}
.input-wrap{position:relative}
.input-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;padding:6px 11px;border-radius:6px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit}
.seg button[data-active="1"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ───────── Modal ───────── */
.modal-backdrop{position:fixed;inset:0;background:rgba(42,29,18,.32);backdrop-filter:blur(2px);z-index:80;display:grid;place-items:center;padding:24px;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:16px;width:min(960px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -10px rgba(42,29,18,.4);animation:popIn .18s cubic-bezier(.3,.7,.4,1.2)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-hd{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-bd{padding:20px 22px;overflow-y:auto}
.modal-ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}
.modal-close{margin-left:auto;width:32px;height:32px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}

/* ───────── Toast ───────── */
.toast-stack{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:var(--sidebar);color:#fff;padding:12px 16px;border-radius:11px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(42,29,18,.28);animation:slideIn .22s cubic-bezier(.3,.7,.4,1.2)}
.toast.success{background:#3d5524}
.toast.error{background:#7a2e22}
.toast.info{background:var(--sidebar)}
.toast b{font-size:13px;font-weight:600;display:block}
.toast small{font-size:11.5px;opacity:.85;display:block;margin-top:1px}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ───────── Utility ───────── */
.muted{color:var(--muted)}
.tab-num{font-variant-numeric:tabular-nums}
.flex{display:flex}
.flex-1{flex:1}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.ai-center{align-items:center}
.jc-between{justify-content:space-between}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 18px;font-size:13px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;color:var(--ink);font-weight:500}

/* ───────── Print preview ───────── */
.print-page{background:#fff;width:794px;min-height:1123px;margin:0 auto;padding:54px 60px;box-shadow:0 4px 24px rgba(42,29,18,.12);font-family:var(--font);color:#1a1a1a}
.print-hd{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;border-bottom:2px solid #1a1a1a}
.print-hd h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.print-hd h2{margin:2px 0 0;font-size:13px;font-weight:500;color:#555}
.print-meta{font-size:11px;color:#555;text-align:right}
.print-tbl{width:100%;border-collapse:collapse;margin-top:22px;font-size:11.5px}
.print-tbl th,.print-tbl td{padding:8px 10px;border-bottom:1px solid #ddd;text-align:left}
.print-tbl th{background:#f0f0f0;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.print-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.print-tbl tfoot td{font-weight:700;border-top:2px solid #1a1a1a}
.print-ft{margin-top:50px;display:flex;justify-content:space-between;font-size:11px;color:#555}
.print-sign{text-align:center;width:180px}
.print-sign .line{margin-top:60px;border-top:1px solid #1a1a1a;padding-top:6px;font-weight:600;color:#1a1a1a}

/* ───────── Charts: legend ───────── */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);padding:0 4px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-sw{width:10px;height:10px;border-radius:3px}

.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state svg{opacity:.35;margin-bottom:10px}

.placeholder{background:
  repeating-linear-gradient(45deg,transparent 0 8px, rgba(184,105,74,.06) 8px 9px),
  var(--surface-2);
  border:1px dashed var(--line);border-radius:10px}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <!-- tweaks-panel -->
  <script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options} onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => { if (min != null && n < min) return min; if (max != null && n > max) return max; return n; };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl">{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }} onClick={() => onChange(o)}>
              {sup.length > 0 && <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'} onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

    { v:"Mencatat setoran", t:"payment" }, { v:"Menambah anggota", t:"create" },
    { v:"Memperbarui data anggota", t:"update" }, { v:"Mengubah jenis tabungan", t:"update" },
    { v:"Login", t:"auth" }, { v:"Export laporan PDF", t:"export" },
    { v:"Export Excel", t:"export" }, { v:"Menonaktifkan anggota", t:"warn" },
  ];
  const out = [];
  const TODAY = new Date(2026, 4, 18, 9, 12);
  let cursor = new Date(TODAY);
  for (let i = 0; i < 24; i++) {
    cursor = new Date(cursor.getTime() - rint(8, 240) * 60 * 1000);
    const v = pick(verbs);
    const u = pick(USERS);
    let detail = "";
    if (v.t === "payment") { const k = pick(KELUARGA); const j = pick(JENIS_IURAN); detail = `${k.kepala_keluarga} — ${j.nama_jenis} Mei 2026`; }
    else if (v.t === "create" || v.t === "warn") { detail = pick(KELUARGA).kepala_keluarga; }
    else if (v.t === "update") { detail = rng() < 0.5 ? pick(KELUARGA).kepala_keluarga : "Nominal Dana Bersama"; }
    else if (v.t === "export") { detail = "Rekap Bulanan April 2026"; }
    else { detail = "Sesi web"; }
    out.push({ id: i + 1, waktu: cursor.toISOString().slice(0,16).replace("T"," "), user: u.nama, aksi: v.v, detail, tipe: v.t });
  }
  return out;
})();

const BULAN_ID = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BULAN_ID_FULL = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function formatCurrency(n, mode = "rp") {
  const abs = Math.abs(Math.round(n));
  const grouped = abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const sign = n < 0 ? "-" : "";
  if (mode === "idr") return `${sign}IDR ${grouped}`;
  return `${sign}Rp ${grouped}`;
}
function formatCurrencyCompact(n, mode = "rp") {
  const abs = Math.abs(n);
  const prefix = mode === "idr" ? "IDR " : "Rp ";
  const sign = n < 0 ? "-" : "";
  if (abs >= 1e9) return `${sign}${prefix}${(abs/1e9).toFixed(1).replace(/\.0$/,"")}M`;
  if (abs >= 1e6) return `${sign}${prefix}${(abs/1e6).toFixed(1).replace(/\.0$/,"")}jt`;
  if (abs >= 1e3) return `${sign}${prefix}${(abs/1e3).toFixed(0)}rb`;
  return `${sign}${prefix}${abs}`;
}
function avatarColor(name) {
  const palette = ["#b8694a","#9a5638","#7a8c4d","#4a6f8a","#8a6e3f","#7a4f37","#6a5a7a","#a37049"];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}
function initials(name) {
  const parts = name.trim().split(/\s+/);
  return (parts[0]?.[0] || "") + (parts[parts.length-1]?.[0] || "");
}

function pembayaranByKeluarga(idKel) { return PEMBAYARAN.filter(p => p.id_keluarga === idKel); }
function totalKeluarga(idKel) { return pembayaranByKeluarga(idKel).reduce((s,p) => s + p.nominal, 0); }
function pembayaranBulan(bulan, tahun) { return PEMBAYARAN.filter(p => p.bulan === bulan && p.tahun === tahun); }
function pemasukanBulanan(tahun) {
  const arr = new Array(12).fill(0);
  for (const p of PEMBAYARAN) { if (p.tahun === tahun) arr[p.bulan - 1] += p.nominal; }
  return arr;
}
function pemasukanPerJenis(tahun, bulan = null) {
  const map = {};
  for (const j of JENIS_IURAN) map[j.id_jenis] = 0;
  for (const p of PEMBAYARAN) {
    if (p.tahun !== tahun) continue;
    if (bulan && p.bulan !== bulan) continue;
    map[p.id_jenis] += p.nominal;
  }
  return JENIS_IURAN.map(j => ({ jenis: j, total: map[j.id_jenis] }));
}
function pemasukanPerTahun() {
  const map = {};
  for (const p of PEMBAYARAN) { map[p.tahun] = (map[p.tahun] || 0) + p.nominal; }
  return Object.entries(map).map(([t,v]) => ({ tahun: Number(t), total: v })).sort((a,b) => a.tahun - b.tahun);
}

         pembayaranByKeluarga, totalKeluarga, pembayaranBulan, pemasukanBulanan, pemasukanPerJenis, pemasukanPerTahun }
});

const ToastCtx = React.createContext(() => {});
const useToast = () => React.useContext(ToastCtx);

function ToastHost({ children }) {
  const [items, setItems] = React.useState([]);
  const push = React.useCallback((t) => {
    const id = Math.random().toString(36).slice(2);
    setItems((xs) => [...xs, { id, kind: "info", ...t }]);
    setTimeout(() => setItems((xs) => xs.filter(x => x.id !== id)), t.duration || 3200);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-stack">
        {items.map(t => (
          <div key={t.id} className={`toast ${t.kind}`}>
            <Icon name={t.kind === "success" ? "check" : t.kind === "error" ? "alert" : "bell"} size={16}/>
            <div><b>{t.title}</b>{t.body && <small>{t.body}</small>}</div>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

function Modal({ open, onClose, title, subtitle, children, footer, width }) {
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{width: width || undefined}} onClick={e => e.stopPropagation()}>
        <div className="modal-hd">
          <div>

  );
}

function BarChart({ data, labels, height = 220, formatY, accent = "var(--accent)" }) {
  const W = 720, H = height;
  const padL = 50, padR = 12, padT = 14, padB = 28;
  const max = Math.max(1, ...data);
  const niceMax = Math.ceil(max / 5e5) * 5e5;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const bw = innerW / data.length * 0.62;
  const gap = (innerW / data.length) * 0.38;
  const [hover, setHover] = React.useState(null);
  const yticks = 4;
  return (
    <div style={{position:"relative"}}>
      <svg className="chart-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        {Array.from({length: yticks + 1}).map((_,i) => {
          const v = (niceMax / yticks) * i;
          const y = padT + innerH - (v / niceMax) * innerH;
          return (
            <g key={i}>
              <line className="chart-grid" x1={padL} x2={W-padR} y1={y} y2={y}/>
              <text className="chart-axis" x={padL - 8} y={y + 3} textAnchor="end">{formatY ? formatY(v) : v}</text>
            </g>
          );
        })}
        {data.map((v,i) => {
          const x = padL + (innerW / data.length) * i + gap / 2;
          const h = niceMax === 0 ? 0 : (v / niceMax) * innerH;
          const y = padT + innerH - h;
          const hi = hover === i;
          return (
            <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
              <rect x={x} y={padT} width={bw} height={innerH} fill="transparent"/>
              <rect x={x} y={y} width={bw} height={h} rx={4} ry={4} fill={hi ? "var(--accent-2)" : accent}/>
              <text className="chart-axis" x={x + bw/2} y={H - 10} textAnchor="middle">{labels[i]}</text>
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <div className="tooltip"
             style={{left:`calc(${(padL+(innerW/data.length)*hover+gap/2+bw/2)/W*100}% - 50px)`,
                     top:`${(padT+innerH-(data[hover]/niceMax)*innerH)/H*100}%`,
                     transform:"translateY(-130%)"}}>
          <b>{labels[hover]}</b> · {formatY ? formatY(data[hover]) : data[hover]}
        </div>
      )}
    </div>
  );
}

function LineChart({ data, labels, height = 220, formatY }) {
  const W = 720, H = height;
  const padL = 50, padR = 12, padT = 14, padB = 28;
  const max = Math.max(1, ...data);
  const niceMax = Math.ceil(max / 5e5) * 5e5;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const pts = data.map((v,i) => {
    const x = padL + (innerW / Math.max(1, data.length - 1)) * i;
    const y = padT + innerH - (v / niceMax) * innerH;
    return { x, y, v, i };
  });
  const pathD = pts.map((p,i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const areaD = `${pathD} L${pts[pts.length-1].x.toFixed(1)} ${padT + innerH} L${pts[0].x.toFixed(1)} ${padT + innerH} Z`;
  const [hover, setHover] = React.useState(null);
  const yticks = 4;
  return (
    <div style={{position:"relative"}}>
      <svg className="chart-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id="chartAreaFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.22"/>
            <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {Array.from({length: yticks + 1}).map((_,i) => {
          const v = (niceMax / yticks) * i;
          const y = padT + innerH - (v / niceMax) * innerH;
          return (
            <g key={i}>
              <line className="chart-grid" x1={padL} x2={W-padR} y1={y} y2={y}/>
              <text className="chart-axis" x={padL - 8} y={y + 3} textAnchor="end">{formatY ? formatY(v) : v}</text>
            </g>
          );
        })}
        <path className="chart-area" d={areaD}/>
        <path className="chart-line" d={pathD}/>
        {pts.map((p) => (
          <g key={p.i} onMouseEnter={() => setHover(p.i)} onMouseLeave={() => setHover(null)}>
            <circle className="chart-dot" cx={p.x} cy={p.y} r={4}/>
            <rect x={p.x - 18} y={padT} width={36} height={innerH} fill="transparent"/>
            <text className="chart-axis" x={p.x} y={H - 10} textAnchor="middle">{labels[p.i]}</text>
          </g>
        ))}
      </svg>
      {hover !== null && (
        <div className="tooltip"
             style={{left:`calc(${pts[hover].x/W*100}% - 50px)`,top:`${pts[hover].y/H*100}%`,transform:"translateY(-160%)"}}>
          <b>{labels[hover]}</b> · {formatY ? formatY(data[hover]) : data[hover]}
        </div>
      )}
    </div>
  );
}

function DonutChart({ slices, total, formatY, size = 200 }) {
  const r = (size - 28) / 2;
  const c = size / 2;
  const C = 2 * Math.PI * r;
  let acc = 0;
  const palette = ["#b8694a","#7a8c4d","#4a6f8a","#c8893a","#9a5638"];
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <circle cx={c} cy={c} r={r} fill="none" stroke="var(--line-2)" strokeWidth="22"/>
      {slices.map((s,i) => {
        const frac = total === 0 ? 0 : s.value / total;
        const dash = frac * C;
        const off = -acc * C;
        acc += frac;
        return (
          <circle key={i} cx={c} cy={c} r={r} fill="none"
                  stroke={palette[i % palette.length]} strokeWidth="22"
                  strokeDasharray={`${dash} ${C - dash}`}
                  strokeDashoffset={off}
                  transform={`rotate(-90 ${c} ${c})`}
                  strokeLinecap="butt"/>
        );
      })}
      <text x={c} y={c - 2} textAnchor="middle" fontSize="11" fill="var(--muted)" fontFamily="var(--font)" fontWeight="500">Total</text>
      <text x={c} y={c + 16} textAnchor="middle" fontSize="15.5" fill="var(--ink)" fontFamily="var(--font)" fontWeight="700" style={{fontVariantNumeric:"tabular-nums"}}>
        {formatY ? formatY(total) : total}
      </text>
    </svg>
  );
}

        {label}
        <span className="sort-ico">
          {!active ? <Icon name="sort" size={12}/> : dir === "asc" ? <Icon name="sort_up" size={12}/> : <Icon name="sort_down" size={12}/>}
        </span>
      </span>
    </th>
  );
}

function sortBy(arr, field, dir) {
  if (!field) return arr;
  const sign = dir === "asc" ? 1 : -1;
  return [...arr].sort((a,b) => {
    const av = a[field], bv = b[field];
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * sign;
    return String(av).localeCompare(String(bv), "id") * sign;
  });
}

function Pager({ page, setPage, total, perPage }) {
  const pages = Math.max(1, Math.ceil(total / perPage));
  const nums = [];
  const win = 2;
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || (i >= page - win && i <= page + win)) nums.push(i);
    else if (nums[nums.length-1] !== "…") nums.push("…");
  }
  const from = total === 0 ? 0 : (page - 1) * perPage + 1;
  const to = Math.min(total, page * perPage);
  return (
    <div className="pager">
      <div>Menampilkan <b className="tab-num" style={{color:"var(--ink)"}}>{from}–{to}</b> dari <b className="tab-num" style={{color:"var(--ink)"}}>{total}</b></div>
      <div className="pager-pages">
        <button disabled={page === 1} onClick={() => setPage(page - 1)}>‹</button>
        {nums.map((n,i) => n === "…"
          ? <button key={i} disabled>…</button>
          : <button key={i} data-active={n === page ? "1" : "0"} onClick={() => setPage(n)}>{n}</button>)}
        <button disabled={page === pages} onClick={() => setPage(page + 1)}>›</button>
      </div>
    </div>
  );
}

function Avatar({ name, size = "md" }) {
  const { avatarColor, initials } = window.STM;
  return (
    <div className={`avatar ${size === "sm" ? "sm" : ""}`} style={{background: avatarColor(name)}}>
      {initials(name).toUpperCase()}
    </div>
  );
}

Object.assign(window, {
  Icon, Sidebar, Topbar, ToastHost, useToast, Modal,
  BarChart, LineChart, DonutChart, SortHeader, sortBy, Pager, Avatar,
});
  </script>

  const filtered = React.useMemo(() => {
    let arr = S.KELUARGA;

    if (search) {
      const q = search.toLowerCase();
      arr = arr.filter(k => k.kepala_keluarga.toLowerCase().includes(q) || k.no_anggota.toLowerCase().includes(q));

  })), [filtered]);

  <script type="text/babel">
function InputPembayaran({ presetKeluarga, currency, onSaved }) {
  const S = window.STM;
  const toast = useToast();
  const today = "2026-05-18";
  const [form, setForm] = React.useState({
    id_keluarga: presetKeluarga?.id_keluarga || "",
    id_jenis: 1, bulan: 5, tahun: 2026, nominal: 25000,
    tanggal_bayar: today, metode_pembayaran: "Tunai", keterangan: "",
  });
  const [saved, setSaved] = React.useState(() => window.__sessionPayments || []);

  React.useEffect(() => {
    if (presetKeluarga) setForm(f => ({ ...f, id_keluarga: presetKeluarga.id_keluarga }));
  }, [presetKeluarga]);

  const onJenisChange = (id) => {
    const j = S.JENIS_IURAN.find(x => x.id_jenis === Number(id));
    setForm(f => ({ ...f, id_jenis: Number(id), nominal: j?.nominal_default || f.nominal }));
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.id_keluarga) { toast({ kind:"error", title:"Pilih anggota terlebih dahulu" }); return; }
    if (!form.nominal || form.nominal < 1000) { toast({ kind:"error", title:"Nominal tidak valid" }); return; }
    const k = S.KELUARGA.find(x => x.id_keluarga === Number(form.id_keluarga));
    const j = S.JENIS_IURAN.find(x => x.id_jenis === Number(form.id_jenis));
    const rec = {
      id_pembayaran: 90000 + saved.length + 1,
      ...form,
      id_keluarga: Number(form.id_keluarga), id_jenis: Number(form.id_jenis),
      bulan: Number(form.bulan), tahun: Number(form.tahun), nominal: Number(form.nominal),
      dicatat_oleh: "Robert Marpaung",
      _kel_name: k?.kepala_keluarga, _jenis_name: j?.nama_jenis,
    };
    const next = [rec, ...saved];
    window.__sessionPayments = next;
    setSaved(next);
    S.PEMBAYARAN.push({
      id_pembayaran: rec.id_pembayaran, id_keluarga: rec.id_keluarga, id_jenis: rec.id_jenis,
      bulan: rec.bulan, tahun: rec.tahun, nominal: rec.nominal,
      tanggal_bayar: rec.tanggal_bayar, metode_pembayaran: rec.metode_pembayaran,
      keterangan: rec.keterangan, dicatat_oleh: rec.dicatat_oleh,
    });
    toast({ kind:"success", title:`Setoran tercatat`,
      body:`${k?.kepala_keluarga} — ${j?.nama_jenis} ${S.BULAN_ID_FULL[rec.bulan-1]} ${rec.tahun} · ${S.formatCurrency(rec.nominal, currency)}` });
    setForm(f => ({ ...f, nominal: S.JENIS_IURAN.find(x => x.id_jenis === f.id_jenis)?.nominal_default || 25000, keterangan: "", id_keluarga: "" }));
    onSaved && onSaved(rec);
  };

  const fmt = (v) => S.formatCurrency(v, currency);

  return (
    <div className="grid" style={{gridTemplateColumns:"1.3fr 1fr",gap:20,alignItems:"flex-start"}}>
      <div className="card">
        <div className="card-hd">
          <div>
            <h3>Catat Setoran Baru</h3>
            <div className="muted" style={{fontSize:12}}>Form dicatat atas nama: <b style={{color:"var(--ink-2)"}}>Robert Marpaung (admin)</b></div>
          </div>
        </div>
        <form className="card-pad" onSubmit={submit} style={{display:"grid",gap:14}}>
          <div className="field">
            <label>Anggota</label>
            <select className="select" value={form.id_keluarga} onChange={e => setForm(f => ({...f, id_keluarga: e.target.value}))}>
              <option value="">— Pilih anggota —</option>
              {S.KELUARGA.filter(k => k.status === "aktif").map(k => (
                <option key={k.id_keluarga} value={k.id_keluarga}>{k.no_anggota} · {k.kepala_keluarga}</option>
              ))}
            </select>
          </div>
          <div className="grid grid-2">
            <div className="field">
              <label>Jenis Tabungan</label>
              <select className="select" value={form.id_jenis} onChange={e => onJenisChange(e.target.value)}>
                {S.JENIS_IURAN.map(j => <option key={j.id_jenis} value={j.id_jenis}>{j.nama_jenis}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Nominal</label>
              <div className="input-wrap">
                <span className="input-prefix">{currency === "idr" ? "IDR" : "Rp"}</span>
                <input className="input" type="number" data-prefix="1" min="1000" step="500"
                       value={form.nominal} onChange={e => setForm(f => ({...f, nominal: Number(e.target.value) || 0}))}/>
              </div>
              <div className="hint">Default: {fmt(S.JENIS_IURAN.find(j => j.id_jenis === Number(form.id_jenis))?.nominal_default || 0)}</div>
            </div>
          </div>
          <div className="grid grid-3">
            <div className="field">
              <label>Bulan Periode</label>
              <select className="select" value={form.bulan} onChange={e => setForm(f => ({...f, bulan: Number(e.target.value)}))}>
                {S.BULAN_ID_FULL.map((b,i) => <option key={i} value={i+1}>{b}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Tahun</label>
              <select className="select" value={form.tahun} onChange={e => setForm(f => ({...f, tahun: Number(e.target.value)}))}>
                {[2024,2025,2026].map(y => <option key={y}>{y}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Tanggal Setor</label>
              <input className="input" type="date" value={form.tanggal_bayar} onChange={e => setForm(f => ({...f, tanggal_bayar: e.target.value}))}/>
            </div>
          </div>
          <div className="grid grid-2">
            <div className="field">
              <label>Metode Setor</label>
              <div className="seg" style={{width:"100%"}}>
                {S.METODE.map(m => (
                  <button key={m} type="button" style={{flex:1}}
                          data-active={form.metode_pembayaran === m ? "1" : "0"}
                          onClick={() => setForm(f => ({...f, metode_pembayaran: m}))}>{m}</button>
                ))}
              </div>
            </div>
            <div className="field">
              <label>Keterangan <span className="muted" style={{fontWeight:400}}>(opsional)</span></label>
              <input className="input" type="text" placeholder="cth. lewat koordinator"
                     value={form.keterangan} onChange={e => setForm(f => ({...f, keterangan: e.target.value}))}/>
            </div>
          </div>
          <div className="flex gap-12" style={{justifyContent:"flex-end",marginTop:6}}>
            <button type="button" className="btn btn-ghost" onClick={() => setForm({
              id_keluarga:"", id_jenis:1, bulan:5, tahun:2026, nominal:25000,
              tanggal_bayar:today, metode_pembayaran:"Tunai", keterangan:"",
            })}>Reset</button>
            <button type="submit" className="btn btn-primary"><Icon name="check" size={14}/> Simpan Setoran</button>
          </div>
        </form>
      </div>

      <div className="card">
        <div className="card-hd">
          <div><h3>Tercatat Sesi Ini</h3><div className="muted" style={{fontSize:12}}>Setoran masuk dari form di sebelah</div></div>
          <div className="card-hd-actions"><span className="badge badge-accent tab-num">{saved.length} entri</span></div>
        </div>
        {saved.length === 0 ? (
          <div className="empty-state">
            <Icon name="receipt" size={36}/>
            <div>Belum ada setoran dicatat sesi ini.</div>
            <div style={{fontSize:12,marginTop:4}}>Form di sebelah kiri akan menambahkan entri di sini.</div>
          </div>
        ) : (
          <div style={{maxHeight:520,overflowY:"auto"}}>
            {saved.map(s => (
              <div key={s.id_pembayaran} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 18px",borderBottom:"1px solid var(--line-2)"}}>
                <Avatar name={s._kel_name} size="sm"/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:"var(--ink)"}}>{s._kel_name}</div>
                  <div style={{fontSize:11.5,color:"var(--muted)"}}>{s._jenis_name} · {S.BULAN_ID[s.bulan-1]} {s.tahun} · {s.metode_pembayaran}</div>
                </div>
                <div className="tab-num" style={{fontSize:13,fontWeight:700,color:"var(--success)"}}>+{fmt(s.nominal)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function RekapBulanan({ currency }) {
  const S = window.STM;
  const [bulan, setBulan] = React.useState(5);
  const [tahun, setTahun] = React.useState(2026);
  const fmt = (v) => S.formatCurrency(v, currency);
  const fmtC = (v) => S.formatCurrencyCompact(v, currency);

  const pays = S.pembayaranBulan(bulan, tahun);
  const total = pays.reduce((s,p) => s + p.nominal, 0);
  const perJenis = {};
  for (const j of S.JENIS_IURAN) perJenis[j.id_jenis] = 0;
  for (const p of pays) perJenis[p.id_jenis] += p.nominal;

  const map = new Map();
  for (const p of pays) {
    if (!map.has(p.id_keluarga)) map.set(p.id_keluarga, { perJenis:{}, total:0, count:0 });
    const row = map.get(p.id_keluarga);
    row.perJenis[p.id_jenis] = (row.perJenis[p.id_jenis] || 0) + p.nominal;
    row.total += p.nominal; row.count += 1;
  }
  const rows = Array.from(map.entries()).map(([id,r]) => ({ k: S.KELUARGA.find(x => x.id_keluarga === id), ...r })).sort((a,b) => b.total - a.total);

  return (
    <div className="grid" style={{gap:16}}>
      <div className="card">
        <div className="card-hd" style={{flexWrap:"wrap"}}>
          <div>
            <h3>Rekap Setoran {S.BULAN_ID_FULL[bulan-1]} {tahun}</h3>
            <div className="muted" style={{fontSize:12}}>Akumulasi setoran tabungan untuk periode terpilih</div>
          </div>
          <div className="card-hd-actions" style={{gap:8,flexWrap:"wrap"}}>
            <select className="select" style={{width:130}} value={bulan} onChange={e => setBulan(Number(e.target.value))}>
              {S.BULAN_ID_FULL.map((b,i) => <option key={i} value={i+1}>{b}</option>)}
            </select>
            <select className="select" style={{width:100}} value={tahun} onChange={e => setTahun(Number(e.target.value))}>
              {[2024,2025,2026].map(y => <option key={y}>{y}</option>)}
            </select>
            <button className="btn btn-sec btn-sm"><Icon name="file_excel" size={14}/> Excel</button>
            <button className="btn btn-dark btn-sm"><Icon name="file_pdf" size={14}/> PDF</button>
          </div>
        </div>
        <div className="card-pad" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,borderBottom:"1px solid var(--line)"}}>
          <div><div className="stat-lbl">Total Masuk</div><div className="stat-val tab-num" style={{fontSize:22}}>{fmtC(total)}</div></div>
          <div><div className="stat-lbl">Transaksi</div><div className="stat-val tab-num" style={{fontSize:22}}>{pays.length}</div></div>
          <div><div className="stat-lbl">Anggota Setor</div><div className="stat-val tab-num" style={{fontSize:22}}>{rows.length}</div></div>
          <div><div className="stat-lbl">Rata-rata / Anggota</div><div className="stat-val tab-num" style={{fontSize:22}}>{fmtC(rows.length===0?0:total/rows.length)}</div></div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead>
              <tr>
                <th style={{width:42}}>#</th>
                <th>Kepala Keluarga</th>
                {S.JENIS_IURAN.map(j => <th key={j.id_jenis} style={{textAlign:"right"}}>{j.nama_jenis}</th>)}
                <th style={{textAlign:"right"}}>Transaksi</th>
                <th style={{textAlign:"right"}}>Total Setor</th>
              </tr>
            </thead>
            <tbody>
              {rows.length === 0 && (
                <tr><td colSpan={4+S.JENIS_IURAN.length}><div className="empty-state"><Icon name="receipt" size={28}/><div>Belum ada setoran pada periode ini.</div></div></td></tr>
              )}
              {rows.map((r,i) => (
                <tr key={r.k.id_keluarga}>
                  <td className="tab-num" style={{color:"var(--muted)"}}>{i+1}</td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Avatar name={r.k.kepala_keluarga} size="sm"/>
                      <div>
                        <div style={{fontWeight:600,color:"var(--ink)"}}>{r.k.kepala_keluarga}</div>
                        <div className="tab-num" style={{fontSize:11,color:"var(--muted)"}}>{r.k.no_anggota}</div>
                      </div>
                    </div>
                  </td>
                  {S.JENIS_IURAN.map(j => (
                    <td key={j.id_jenis} className="tbl-num" style={{color:(r.perJenis[j.id_jenis]||0)===0?"var(--muted)":"var(--ink)"}}>
                      {(r.perJenis[j.id_jenis]||0)===0?"—":fmt(r.perJenis[j.id_jenis])}
                    </td>
                  ))}
                  <td className="tbl-num">{r.count}×</td>
                  <td className="tbl-num"><b>{fmt(r.total)}</b></td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{background:"var(--surface-2)",fontWeight:700}}>
                <td colSpan={2} style={{padding:"12px 16px"}}>Total Kolom</td>
                {S.JENIS_IURAN.map(j => (
                  <td key={j.id_jenis} className="tbl-num" style={{padding:"12px 16px",borderTop:"2px solid var(--ink-2)"}}>{fmt(perJenis[j.id_jenis])}</td>
                ))}
                <td className="tbl-num" style={{padding:"12px 16px",borderTop:"2px solid var(--ink-2)"}}>{pays.length}</td>
                <td className="tbl-num" style={{padding:"12px 16px",borderTop:"2px solid var(--ink-2)"}}>{fmt(total)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}

function RekapTahunan({ currency }) {
  const S = window.STM;
  const [tahun, setTahun] = React.useState(2026);
  const fmt = (v) => S.formatCurrency(v, currency);
  const fmtC = (v) => S.formatCurrencyCompact(v, currency);

  const perBulan = S.pemasukanBulanan(tahun);
  const total = perBulan.reduce((a,b) => a + b, 0);
  const perJenis = S.pemasukanPerJenis(tahun);
  const allYears = S.pemasukanPerTahun();
  const running = (() => { let acc = 0; return perBulan.map(v => { if (v > 0) acc += v; return acc; }); })();

  return (
    <div className="grid" style={{gap:16}}>
      <div className="card">
        <div className="card-hd">
          <div><h3>Rekap Tahunan {tahun}</h3><div className="muted" style={{fontSize:12}}>Komparasi setoran bulanan & breakdown jenis tabungan</div></div>
          <div className="card-hd-actions">
            <select className="select" style={{width:100}} value={tahun} onChange={e => setTahun(Number(e.target.value))}>
              {[2024,2025,2026].map(y => <option key={y}>{y}</option>)}
            </select>
            <button className="btn btn-sec btn-sm"><Icon name="file_excel" size={14}/> Excel</button>
            <button className="btn btn-dark btn-sm"><Icon name="file_pdf" size={14}/> PDF</button>
          </div>
        </div>
        <div className="card-pad" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,borderBottom:"1px solid var(--line)"}}>
          <div><div className="stat-lbl">Total {tahun}</div><div className="stat-val tab-num" style={{fontSize:22}}>{fmtC(total)}</div></div>
          <div><div className="stat-lbl">Rata-rata Bulanan</div><div className="stat-val tab-num" style={{fontSize:22}}>{fmtC(total/Math.max(1,perBulan.filter(v=>v>0).length))}</div></div>
          <div>
            <div className="stat-lbl">Bulan Tertinggi</div>
            <div className="stat-val tab-num" style={{fontSize:22}}>
              {S.BULAN_ID[perBulan.indexOf(Math.max(...perBulan))]}
              <span style={{fontSize:13,color:"var(--muted)",fontWeight:500}}> · {fmtC(Math.max(...perBulan))}</span>
            </div>
          </div>
          <div><div className="stat-lbl">Saldo Akhir Tahun</div><div className="stat-val tab-num" style={{fontSize:22}}>{fmtC(running[running.length-1]||0)}</div></div>
        </div>
        <div className="chart-wrap">
          <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600,marginBottom:6}}>Setoran per Bulan</div>
          <BarChart data={perBulan} labels={S.BULAN_ID} height={240} formatY={fmtC}/>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead>
              <tr>
                <th>Bulan</th>
                {S.JENIS_IURAN.map(j => <th key={j.id_jenis} style={{textAlign:"right"}}>{j.nama_jenis}</th>)}
                <th style={{textAlign:"right"}}>Total</th>
                <th style={{textAlign:"right"}}>Saldo Berjalan</th>
              </tr>
            </thead>
            <tbody>
              {S.BULAN_ID_FULL.map((b,i) => {
                const pays = S.PEMBAYARAN.filter(p => p.tahun === tahun && p.bulan === i+1);
                const perJ = {};
                for (const j of S.JENIS_IURAN) perJ[j.id_jenis] = 0;
                for (const p of pays) perJ[p.id_jenis] += p.nominal;
                const t = pays.reduce((s,p) => s + p.nominal, 0);
                const isF = t === 0;
                return (
                  <tr key={i} style={isF?{opacity:.4}:{}}>
                    <td><b>{b}</b></td>
                    {S.JENIS_IURAN.map(j => <td key={j.id_jenis} className="tbl-num">{perJ[j.id_jenis]===0?"—":fmt(perJ[j.id_jenis])}</td>)}
                    <td className="tbl-num"><b>{isF?"—":fmt(t)}</b></td>
                    <td className="tbl-num" style={{color:"var(--accent)"}}><b>{isF?"—":fmt(running[i])}</b></td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{background:"var(--surface-2)",fontWeight:700}}>
                <td style={{padding:"12px 16px"}}>Total {tahun}</td>
                {S.JENIS_IURAN.map(j => (
                  <td key={j.id_jenis} className="tbl-num" style={{padding:"12px 16px",borderTop:"2px solid var(--ink-2)"}}>{fmt(perJenis.find(x=>x.jenis.id_jenis===j.id_jenis)?.total||0)}</td>
                ))}
                <td className="tbl-num" style={{padding:"12px 16px",borderTop:"2px solid var(--ink-2)"}}>{fmt(total)}</td>
                <td style={{borderTop:"2px solid var(--ink-2)"}}></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
      <div className="card">
        <div className="card-hd">
          <div><h3>Perbandingan Multi-Tahun</h3><div className="muted" style={{fontSize:12}}>Total setoran per tahun</div></div>
        </div>
        <div className="card-pad">
          {allYears.map(y => {
            const max = Math.max(...allYears.map(a => a.total));
            const pct = (y.total / max) * 100;
            return (
              <div key={y.tahun} style={{display:"flex",alignItems:"center",gap:14,padding:"10px 0",borderBottom:"1px solid var(--line-2)"}}>
                <div style={{width:60,fontWeight:700}}>{y.tahun}</div>
                <div style={{flex:1,height:14,background:"var(--surface-2)",borderRadius:7,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:y.tahun===2026?"var(--accent)":"var(--success)",borderRadius:7,transition:"width .3s"}}/>
                </div>
                <div className="tab-num" style={{width:140,textAlign:"right",fontWeight:700}}>{fmt(y.total)}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
Object.assign(window, { InputPembayaran, RekapBulanan, RekapTahunan });
  </script>

                <td>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:28,height:28,borderRadius:8,background:"var(--accent-soft)",color:"var(--accent-2)",display:"grid",placeItems:"center"}}>
                      <Icon name="tag" size={14}/>
                    </div>
                    <b style={{color:"var(--ink)"}}>{j.nama_jenis}</b>
                  </div>
                </td>
                <td className="tbl-num"><b>{fmt(j.nominal_default)}</b></td>
                <td className="tbl-num">{usage(j.id_jenis)}</td>
                <td className="tbl-num"><b>{fmt(total(j.id_jenis))}</b></td>
                <td>
                  <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                    <button className="btn btn-sec btn-sm" onClick={() => setEdit(j)}><Icon name="edit" size={12}/> Edit</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <Modal open={!!edit} onClose={() => setEdit(null)}
             title={edit?.id_jenis ? "Edit Jenis Tabungan" : "Tambah Jenis Tabungan"} width="520px"
             footer={<>
               <button className="btn btn-ghost" onClick={() => setEdit(null)}>Batal</button>
               <button className="btn btn-primary" onClick={() => {
                 if (!edit.nama_jenis.trim()) { toast({kind:"error",title:"Nama wajib diisi"}); return; }
                 if (edit.id_jenis) {
                   setList(list.map(x => x.id_jenis===edit.id_jenis?edit:x));
                   toast({kind:"success",title:"Jenis tabungan diperbarui",body:edit.nama_jenis});
                 } else {
                   const id = Math.max(...list.map(x => x.id_jenis)) + 1;
                   setList([...list,{...edit,id_jenis:id}]);
                   toast({kind:"success",title:"Jenis tabungan ditambahkan",body:edit.nama_jenis});
                 }
                 setEdit(null);
               }}><Icon name="check" size={14}/> Simpan</button>
             </>}>
        {edit && (
          <div className="grid" style={{gap:14}}>
            <div className="field">
              <label>Nama Jenis</label>
              <input className="input" value={edit.nama_jenis} onChange={e => setEdit({...edit,nama_jenis:e.target.value})} placeholder="cth. Tabungan Pendidikan"/>
            </div>
            <div className="field">
              <label>Nominal Default</label>
              <div className="input-wrap">
                <span className="input-prefix">{currency==="idr"?"IDR":"Rp"}</span>
                <input className="input" data-prefix="1" type="number" value={edit.nominal_default} onChange={e => setEdit({...edit,nominal_default:Number(e.target.value)||0})}/>
              </div>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

        <div className="card-hd-actions">
